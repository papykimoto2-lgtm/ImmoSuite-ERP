<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Espace Souscripteur – ImmoSuite ERP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg: #F5F7FB;
      --card: #FFFFFF;
      --text: #1E293B;
      --text-light: #64748B;
      --border: #E2E8F0;
      --primary: #B87333;
      --primary-dark: #8B5520;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --info: #3B82F6;
      --radius: 12px;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1E2A3A 0%, #2563EB 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      box-shadow: 0 10px 15px -3px rgba(184,115,51,0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
    }
    .login-field {
      margin-bottom: 18px;
    }
    .login-field label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      font-size: 16px;
      background: #F8FAFC;
      transition: all 0.2s;
    }
    .login-field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184,115,51,0.2);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }
    /* App */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-brand {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
    }
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 8px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .content {
      padding: 20px;
      flex: 1;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border-top: 3px solid var(--primary);
    }
    .kpi-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-weight: 600;
      color: var(--text-light);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-success { background: #D1FAE5; color: #065F46; }
    .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-danger { background: #FEE2E2; color: #991B1B; }
    .badge-info { background: #DBEAFE; color: #1E40AF; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 6px 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }
    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #F8FAFC;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .photo-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .photo-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }
    .photo-caption {
      padding: 8px;
      font-size: 11px;
      text-align: center;
      color: var(--text-light);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 32px;
      color: white;
      cursor: pointer;
    }
    .logout-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    @media (max-width: 500px) {
      .kpi-value { font-size: 18px; }
      .tab-btn { font-size: 12px; padding: 12px 4px; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="logo"><div class="logo-icon">🏠</div><h1>Espace Souscripteur</h1><p style="font-size:13px;margin-top:8px;color:#64748B;">ImmoSuite ERP</p></div>
    <div id="login-error" class="error-msg" style="display:none;"></div>
    <div class="login-field"><label>Numéro de dossier / Email / Téléphone</label><input type="text" id="login-identifier" placeholder="Ex: SP008" autocomplete="username"></div>
    <div class="login-field"><label>Code d'accès</label><input type="password" id="login-code" placeholder="Code à 8 chiffres" autocomplete="current-password"></div>
    <button class="btn" id="login-btn">Se connecter →</button>
    <div style="margin-top:16px;font-size:12px;text-align:center;color:#94A3B8;">🔒 Sécurisé · Accès privé</div>
  </div>
</div>
<div id="app">
  <div class="topbar"><div class="topbar-brand">Mon espace ImmoSuite</div><div class="topbar-user"><span id="welcome-name"></span><button class="logout-btn" id="logout-btn">Déconnexion</button></div></div>
  <div class="tabs" id="tabs"><button class="tab-btn active" data-tab="dashboard">📊 Tableau de bord</button><button class="tab-btn" data-tab="echeances">📅 Échéancier</button><button class="tab-btn" data-tab="versements">💳 Versements</button><button class="tab-btn" data-tab="documents">📁 Documents</button><button class="tab-btn" data-tab="photos">📸 Chantier</button></div>
  <div class="content">
    <div id="tab-dashboard" class="tab-pane active"><div class="kpi-grid"><div class="kpi"><div class="kpi-label">Montant souscrit</div><div class="kpi-value" id="kpi-total">0 F</div></div><div class="kpi"><div class="kpi-label">Déjà versé</div><div class="kpi-value" id="kpi-versé">0 F</div></div><div class="kpi"><div class="kpi-label">Reste à payer</div><div class="kpi-value" id="kpi-reste">0 F</div></div><div class="kpi"><div class="kpi-label">Avancement</div><div class="kpi-value" id="kpi-pct">0%</div></div></div><div class="card"><div style="font-weight:700;margin-bottom:8px;">Informations dossier</div><div id="client-info"></div></div><div class="card"><div style="font-weight:700;margin-bottom:8px;">📈 Avancement du programme</div><div id="programme-avancement"></div></div></div>
    <div id="tab-echeances" class="tab-pane"><div class="card"><div class="table-wrap"><table id="echeancier-table"><thead><tr><th>#</th><th>Mois</th><th>Mensualité (F)</th><th>Versé (F)</th><th>Statut</th></tr></thead><tbody id="echeancier-body"></tbody></table></div></div></div>
    <div id="tab-versements" class="tab-pane"><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Montant (F)</th><th>Mode</th><th>Référence</th></tr></thead><tbody id="versements-body"></tbody></table></div></div></div>
    <div id="tab-documents" class="tab-pane"><div id="documents-list" class="card"></div></div>
    <div id="tab-photos" class="tab-pane"><div id="photos-list" class="photos-grid"></div></div>
  </div>
</div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()"><span class="lightbox-close">&times;</span><img id="lightbox-img" src=""></div>
<script>
  // ======================= CONFIGURATION SUPABASE (intégrée) =======================
  const SUPABASE_URL = 'https://izgpvhwhbrgeagjfhfli.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6Z3B2aHdoYnJnZWFnamZoZmxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDQxNjcsImV4cCI6MjA5NTg4MDE2N30.dVSEbxa09gEMM1OJYISBmfsdTYzjeMEnVzaD4evXI-Y';

  // ==============================================================================
  const DB_NAME = 'ImmoSuiteDB';
  const DB_VERSION = 109;
  let db = null;
  let DATA = { clients: [], versements: [], programmes: [], conventions: [], rapports_chantier: [], documents: [], lots: [] };
  let currentClient = null;

  // Fonctions IndexedDB
  function openDB() { return new Promise((resolve, reject) => { const req = indexedDB.open(DB_NAME, DB_VERSION); req.onsuccess = () => { db = req.result; resolve(); }; req.onerror = () => reject(req.error); }); }
  async function dbGetAll(storeName) { if (!db || !db.objectStoreNames.contains(storeName)) return []; const tx = db.transaction(storeName, 'readonly'); const store = tx.objectStore(storeName); return new Promise((resolve) => { const req = store.getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => resolve([]); }); }
  async function dbPut(store, obj) { if (!db || !db.objectStoreNames.contains(store)) return; const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(obj); return new Promise(resolve => { tx.oncomplete = resolve; }); }

  async function loadAllData() {
    DATA.clients = await dbGetAll('clients');
    DATA.versements = await dbGetAll('versements');
    DATA.programmes = await dbGetAll('programmes');
    DATA.conventions = await dbGetAll('conventions');
    DATA.rapports_chantier = await dbGetAll('rapports_chantier');
    DATA.documents = await dbGetAll('documents');
    DATA.lots = await dbGetAll('lots');
  }

  // Hachage SHA256 (identique à l'ERP)
  async function hashPassword(password, salt) {
    const enc = new TextEncoder();
    const data = enc.encode(password + salt);
    if (crypto.subtle) {
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    } else {
      let h = 0;
      for (let i = 0; i < data.length; i++) h = ((h << 5) - h) + data[i] | 0;
      return h.toString(16);
    }
  }
  async function verifyCode(client, code) {
    if (!code || !client) return false;
    if (client.code_acces_hash && client.code_acces_salt) {
      const computed = await hashPassword(code, client.code_acces_salt);
      if (computed === client.code_acces_hash) return true;
    }
    if (client.code_acces === code) return true;
    if (client.mot_de_passe === code) return true;
    return false;
  }

  // Session persistante (localStorage)
  function saveSession(client) { localStorage.setItem('souscripteur_session', JSON.stringify({ id: client.id, dossier: client.dossier, expire: Date.now() + 24*3600000 })); }
  function loadSession() {
    const raw = localStorage.getItem('souscripteur_session');
    if (!raw) return null;
    try {
      const sess = JSON.parse(raw);
      if (sess.expire && sess.expire > Date.now()) {
        const client = DATA.clients.find(c => c.id === sess.id);
        if (client) return client;
      }
      localStorage.removeItem('souscripteur_session');
    } catch(e) {}
    return null;
  }

  // Synchronisation Supabase (directe, sans localStorage)
  let SB = { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  async function sbFetch(path, method, body) {
    if (!SB.url || !SB.key) return null;
    try {
      const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'apikey': SB.key, 'Authorization': 'Bearer ' + SB.key } };
      if (body) opts.body = JSON.stringify(body);
      const resp = await fetch(SB.url + '/rest/v1/' + path, opts);
      if (!resp.ok) return null;
      const txt = await resp.text();
      return txt ? JSON.parse(txt) : [];
    } catch(e) { return null; }
  }
  async function pullFromCloudSilent() {
    if (!SB.url || !SB.key || !navigator.onLine) return;
    const tables = [
      ['pi_clients', 'clients'], ['pi_versements', 'versements'], ['pi_programmes', 'programmes'],
      ['pi_conventions', 'conventions'], ['pi_rapports_chantier', 'rapports_chantier'],
      ['pi_documents', 'documents'], ['pi_lots', 'lots']
    ];
    for (const [table, store] of tables) {
      const rows = await sbFetch(table + '?select=*', 'GET');
      if (!rows || !rows.length) continue;
      const byId = {};
      DATA[store].forEach(x => { if (x && x.id) byId[x.id] = x; });
      for (const row of rows) {
        const r = row.data || row;
        if (!r || !r.id) continue;
        if (!byId[r.id]) {
          byId[r.id] = r;
          try { await dbPut(store, r); } catch(e) {}
        } else if (r._modifie && byId[r.id]._modifie && r._modifie > byId[r.id]._modifie) {
          byId[r.id] = r;
          try { await dbPut(store, r); } catch(e) {}
        }
      }
      DATA[store] = Object.values(byId);
    }
  }

  // Rendu des données
  function formatFCFA(n) { return (Math.round(n) || 0).toLocaleString('fr-FR') + ' FCFA'; }
  function formatDate(str) { if (!str) return '—'; const d = new Date(str); return d.toLocaleDateString('fr-FR'); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

  async function renderDashboard() {
    if (!currentClient) return;
    const total = parseFloat(currentClient.montant_total) || 0;
    const versements = DATA.versements.filter(v => v.client_id === currentClient.id);
    const verse = versements.reduce((s, v) => s + (parseFloat(v.montant) || 0), 0);
    const reste = Math.max(0, total - verse);
    const pct = total > 0 ? Math.round((verse / total) * 100) : 0;
    document.getElementById('kpi-total').innerText = formatFCFA(total);
    document.getElementById('kpi-versé').innerText = formatFCFA(verse);
    document.getElementById('kpi-reste').innerText = formatFCFA(reste);
    document.getElementById('kpi-pct').innerText = pct + '%';
    const prog = DATA.programmes.find(p => p.id === currentClient.programme_id);
    const lot = DATA.lots.find(l => l.id === currentClient.lot_id);
    document.getElementById('client-info').innerHTML = `<div><strong>${escapeHtml(currentClient.nom)} ${escapeHtml(currentClient.prenoms || '')}</strong></div><div>Dossier: ${escapeHtml(currentClient.dossier || '—')}</div><div>Programme: ${escapeHtml(prog ? prog.nom : '—')}</div><div>Lot: ${escapeHtml(lot ? lot.numero : '—')} (${escapeHtml(lot?.type || '—')})</div><div>Mode livraison: ${currentClient.mode_livraison === 'cle_en_main' ? 'Clé en main' : 'Gros œuvre'}</div>`;
    let avHtml = '<div style="font-size:13px;">Chargement...</div>';
    if (prog) {
      const convs = DATA.conventions.filter(c => c.programme_id === prog.id);
      const rapports = DATA.rapports_chantier.filter(r => convs.some(c => c.id === r.convention_id) && r.visibilite !== 'interne');
      const lastRapport = rapports.sort((a,b) => (b.date_debut||'').localeCompare(a.date_debut||''))[0];
      if (lastRapport) avHtml = `<div>Dernière mise à jour: ${formatDate(lastRapport.date_debut)}</div><div>Avancement: ${lastRapport.avancement || 0}%</div><div class="progress-bar"><div class="progress-fill" style="width:${lastRapport.avancement || 0}%"></div></div><div style="margin-top:8px;">${escapeHtml((lastRapport.travaux_realises || '').substring(0, 120))}…</div>`;
      else avHtml = '<div>Aucun rapport de chantier disponible.</div>';
    }
    document.getElementById('programme-avancement').innerHTML = avHtml;
  }
  function renderEcheancier() {
    if (!currentClient) return;
    const total = parseFloat(currentClient.montant_total) || 0;
    const apport = parseFloat(currentClient.apport) || 0;
    const duree = parseInt(currentClient.duree) || 60;
    const mensualite = duree > 0 ? Math.ceil((total - apport) / duree) : 0;
    const debut = currentClient.date_debut ? new Date(currentClient.date_debut) : new Date();
    const versements = DATA.versements.filter(v => v.client_id === currentClient.id);
    const verseMap = {};
    versements.forEach(v => { const moisKey = v.mois || (v.date ? v.date.slice(0,7) : null); if (moisKey) verseMap[moisKey] = (verseMap[moisKey] || 0) + (parseFloat(v.montant) || 0); });
    const today = new Date();
    let rows = '';
    for (let i = 0; i < duree; i++) {
      const d = new Date(debut.getFullYear(), debut.getMonth() + i, 1);
      const moisKey = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      const paye = verseMap[moisKey] || 0;
      const statut = paye >= mensualite ? 'payé' : (paye > 0 ? 'partiel' : (d <= today ? 'retard' : 'à venir'));
      let badgeClass = statut==='payé'?'badge-success':statut==='partiel'?'badge-warning':statut==='retard'?'badge-danger':'badge-info';
      const label = {payé:'Payé', partiel:'Partiel', retard:'En retard', 'à venir':'À venir'}[statut];
      rows += `<tr><td>${i+1}</td><td>${d.toLocaleDateString('fr-FR', { month:'long', year:'numeric' })}</td><td>${formatFCFA(mensualite)}</td><td>${paye ? formatFCFA(paye) : '—'}</td><td><span class="badge ${badgeClass}">${label}</span></td></tr>`;
    }
    document.getElementById('echeancier-body').innerHTML = rows;
  }
  function renderVersements() {
    if (!currentClient) return;
    const vers = DATA.versements.filter(v => v.client_id === currentClient.id).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const tbody = document.getElementById('versements-body');
    if (!vers.length) { tbody.innerHTML = '<tr><td colspan="4">Aucun versement enregistré.?</div>'; return; }
    tbody.innerHTML = vers.map(v => `<tr><td>${formatDate(v.date)}</td><td>${formatFCFA(v.montant)}</td><td>${escapeHtml(v.mode || '—')}</td><td>${escapeHtml(v.ref || '—')}</td></tr>`).join('');
  }
  async function renderDocuments() {
    if (!currentClient) return;
    const docs = DATA.documents.filter(d => d.entity_type === 'client' && d.entity_id === currentClient.id);
    const container = document.getElementById('documents-list');
    if (!docs.length) { container.innerHTML = '<div class="card" style="text-align:center;">Aucun document disponible.</div>'; return; }
    container.innerHTML = docs.map(doc => `<div class="doc-item"><div><span class="doc-icon">📄</span> <span class="doc-name">${escapeHtml(doc.name)}</span><br><small>${formatDate(doc.upload_date)} · ${(doc.size/1024).toFixed(0)} KB</small></div><a href="${doc.blob}" download="${doc.name}" class="btn" style="background:#E2E8F0; color:#1E293B; padding:6px 12px; text-decoration:none; border-radius:20px; font-size:12px;">Télécharger</a></div>`).join('');
  }
  async function renderPhotos() {
    if (!currentClient) return;
    const prog = DATA.programmes.find(p => p.id === currentClient.programme_id);
    if (!prog) { document.getElementById('photos-list').innerHTML = '<div class="card">Aucun programme associé.</div>'; return; }
    const convs = DATA.conventions.filter(c => c.programme_id === prog.id);
    const rapports = DATA.rapports_chantier.filter(r => convs.some(c => c.id === r.convention_id) && r.visibilite !== 'interne');
    let allPhotos = [];
    rapports.forEach(r => { if (r.photos && r.photos.length) { r.photos.forEach(p => { if (p.visible !== false) allPhotos.push({ ...p, date: r.date_debut, legende: p.legende || `Chantier ${r.date_debut}` }); }); } });
    const container = document.getElementById('photos-list');
    if (!allPhotos.length) { container.innerHTML = '<div class="card">Aucune photo de chantier disponible pour le moment.</div>'; return; }
    container.innerHTML = allPhotos.map((photo, idx) => `<div class="photo-card" onclick="openLightbox('${photo.data.replace(/'/g, "\\'")}', '${escapeHtml(photo.legende)}')"><img src="${photo.data}" alt="Photo chantier" loading="lazy"><div class="photo-caption">${escapeHtml(photo.legende)}<br><small>${formatDate(photo.date)}</small></div></div>`).join('');
  }
  window.openLightbox = function(src, caption) { const lb = document.getElementById('lightbox'); const img = document.getElementById('lightbox-img'); img.src = src; img.alt = caption; lb.style.display = 'flex'; };
  window.closeLightbox = function() { document.getElementById('lightbox').style.display = 'none'; };
  function attachTabEvents() { document.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => { const tabId = btn.dataset.tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active')); document.getElementById(`tab-${tabId}`).classList.add('active'); if (tabId === 'echeances') renderEcheancier(); else if (tabId === 'versements') renderVersements(); else if (tabId === 'documents') renderDocuments(); else if (tabId === 'photos') renderPhotos(); else if (tabId === 'dashboard') renderDashboard(); }; }); }

  // Login
  const loginScreen = document.getElementById('login-screen');
  const appDiv = document.getElementById('app');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  async function doLogin() {
    const identifier = document.getElementById('login-identifier').value.trim();
    const code = document.getElementById('login-code').value.trim();
    if (!identifier || !code) { loginError.textContent = 'Veuillez remplir tous les champs.'; loginError.style.display = 'block'; return; }
    const normalized = identifier.toLowerCase();
    const client = DATA.clients.find(c => (c.dossier && c.dossier.toLowerCase() === normalized) || (c.email && c.email.toLowerCase() === normalized) || (c.tel && c.tel.replace(/\s/g, '') === identifier.replace(/\s/g, '')));
    if (!client || !(await verifyCode(client, code))) { loginError.textContent = 'Identifiant ou code d\'accès incorrect.'; loginError.style.display = 'block'; return; }
    currentClient = client;
    saveSession(client);
    loginScreen.style.display = 'none';
    appDiv.style.display = 'flex';
    document.getElementById('welcome-name').innerText = client.prenoms ? `${client.prenoms} ${client.nom}` : client.nom;
    await renderDashboard();
    renderEcheancier();
    renderVersements();
    renderDocuments();
    renderPhotos();
    attachTabEvents();
  }
  loginBtn.onclick = doLogin;
  document.getElementById('login-code').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('login-identifier').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('logout-btn').onclick = () => { localStorage.removeItem('souscripteur_session'); currentClient = null; appDiv.style.display = 'none'; loginScreen.style.display = 'flex'; document.getElementById('login-identifier').value = ''; document.getElementById('login-code').value = ''; };

  // Démarrage
  async function start() {
    await openDB();
    await loadAllData();
    if (navigator.onLine) await pullFromCloudSilent(); // synchronisation cloud automatique
    await loadAllData(); // recharger après sync
    const sessionClient = loadSession();
    if (sessionClient) {
      currentClient = sessionClient;
      loginScreen.style.display = 'none';
      appDiv.style.display = 'flex';
      document.getElementById('welcome-name').innerText = currentClient.prenoms ? `${currentClient.prenoms} ${currentClient.nom}` : currentClient.nom;
      await renderDashboard();
      renderEcheancier();
      renderVersements();
      renderDocuments();
      renderPhotos();
      attachTabEvents();
    } else {
      loginScreen.style.display = 'flex';
      appDiv.style.display = 'none';
    }
  }
  start();
</script>
</body>
</html>
